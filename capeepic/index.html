<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cape Epic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ANE Cape Epic 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,112,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para móvil, cabecera fija arriba, pestañas abajo; el mapa esquemático con la línea ocre es la pieza fuerte */
:root{
  --bg:#FFFFFF; --surface:#F6F4F0; --ink:#191919; --muted:#6B6E74; --line:#E5E0D7;
  --ocre:#C9862E; --ocre-ink:#8C5717; --ocre-soft:#F3E4CC; --dust:#E9D6B4;
  --on-ocre:#191919; --tab-bg:#191919; --tab-ink:#FFFFFF;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --surface:#232220; --ink:#FFFFFF; --muted:#A8ABB1; --line:#3A3631;
  --ocre:#E0A04A; --ocre-ink:#EDB566; --ocre-soft:#3A2D1C; --dust:#4A3B26;
  --on-ocre:#191919; --tab-bg:#0F0F0F; --tab-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --surface:#232220; --ink:#FFFFFF; --muted:#A8ABB1; --line:#3A3631;
  --ocre:#E0A04A; --ocre-ink:#EDB566; --ocre-soft:#3A2D1C; --dust:#4A3B26;
  --on-ocre:#191919; --tab-bg:#0F0F0F; --tab-ink:#FFFFFF; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3,.disp{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;margin:0;text-wrap:balance}
a{color:var(--ocre-ink)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ocre);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-bottom:10px}
.mono{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;font-size:22px;line-height:1}
.mono span{color:var(--ocre)}
.top small{color:var(--muted);font-size:12px;text-align:right;line-height:1.3}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab-bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;color:var(--tab-ink);opacity:.6;padding:12px 4px 14px;font-weight:600;font-size:13px;cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{opacity:1;border-top-color:var(--ocre)}

section.view{padding-top:20px;display:flex;flex-direction:column;gap:22px}

/* Hoy */
.kicker{font-size:13px;font-weight:600;color:var(--ocre-ink)}
.today-title{font-size:clamp(44px,13vw,76px)}
.today-title .l2{display:block;color:var(--ocre);margin-top:-.12em}
.stats{display:flex;flex-wrap:wrap;gap:18px 26px}
.stat b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;font-size:34px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stars{color:var(--ocre);letter-spacing:2px;font-size:16px}
.stars .off{color:var(--line)}

.panel{background:var(--surface);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:20px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ocre);color:var(--on-ocre);border:0;border-radius:3px;padding:12px 16px;font-weight:700;text-decoration:none;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.quiet{background:transparent;color:var(--ocre-ink);padding:8px 0;min-height:auto}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* Mapa */
.mapbox{background:var(--surface);border-radius:4px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{padding:10px 14px 12px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ocre)}
.key i.dash{border-top:3px dashed var(--muted)}

/* Etapas */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daystrip button{flex:0 0 auto;border:2px solid var(--line);background:var(--bg);border-radius:3px;padding:8px 10px;cursor:pointer;text-align:left;min-width:62px}
.daystrip button b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;font-size:18px;line-height:1}
.daystrip button span{font-size:11px;color:var(--muted)}
.daystrip button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.daystrip button[aria-selected="true"] span{color:var(--dust)}
.stage-h{font-size:clamp(38px,11vw,62px)}
.route{font-weight:600}
.sectors{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sectors li{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.sectors li.tts{border-color:var(--ocre);color:var(--ocre-ink);font-weight:600}
.pending{border-left:4px solid var(--ocre);padding:4px 0 4px 12px;font-size:14px}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:6px;border-top:1px solid var(--line)}
.rank{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;font-size:26px;line-height:1;color:var(--ocre-ink)}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ocre)}

/* Casas */
.night{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.night:first-child{border-top:0}
.night .d b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-stretch:112%;font-size:26px;line-height:1}
.night .d span{font-size:12px;color:var(--muted)}
.house{min-width:0;display:flex;flex-direction:column;gap:4px}
.house .name{font-weight:700}
.house .addr{font-size:14px;overflow-wrap:anywhere}
.house .notes{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.house .acts{display:flex;gap:14px;flex-wrap:wrap}
.empty-night{font-size:14px;color:var(--muted)}
.base-tag{font-size:12px;color:var(--ocre-ink);font-weight:600}
form.casa{display:grid;gap:12px}
form.casa label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
form.casa input,form.casa textarea{background:var(--bg);border:2px solid var(--line);border-radius:3px;padding:10px 12px;font-weight:400;font-size:16px;width:100%}
form.casa input:focus,form.casa textarea:focus{border-color:var(--ocre);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:14px;color:var(--ocre-ink)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}

/* Info */
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.list .it:first-child{border-top:0}
.list .it b{font-variant-numeric:tabular-nums}
.copy{background:none;border:0;color:var(--ocre-ink);font-weight:600;cursor:pointer;padding:0}

@media (prefers-reduced-motion:no-preference){
  .route-line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="mono">ANE <span>×</span> CAPE EPIC</div>
    <small><span id="hdr-sub">21–28 marzo 2027</span><br><span class="num" id="hdr-clock">Hora SA</span></small>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-hoy" aria-label="Hoy"></section>
  <section class="view" id="v-etapas" aria-label="Etapas" hidden></section>
  <section class="view" id="v-casas" aria-label="Casas" hidden></section>
  <section class="view" id="v-info" aria-label="Info" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button role="tab" id="t-hoy" data-v="hoy" aria-selected="true">Hoy</button>
    <button role="tab" id="t-etapas" data-v="etapas" aria-selected="false">Etapas</button>
    <button role="tab" id="t-casas" data-v="casas" aria-selected="false">Casas</button>
    <button role="tab" id="t-info" data-v="info" aria-selected="false">Info</button>
  </div>
</nav>

<script>
/* ---------- Datos oficiales ruta 2027 (epic-series.com) ---------- */
const PLACES = {
  lourensford:{name:"Lourensford Wine Estate",town:"Somerset West",lat:-34.068,lon:18.887,q:"Lourensford Wine Estate, Somerset West"},
  ceres:{name:"Ceres",town:"Ceres",lat:-33.369,lon:19.310,q:"Ceres, Western Cape"},
  saronsberg:{name:"Saronsberg",town:"Tulbagh",lat:-33.255,lon:19.138,q:"Saronsberg Wine Cellar, Tulbagh"},
  riebeek:{name:"Riebeek Kasteel",town:"Riebeek Kasteel",lat:-33.383,lon:18.896,q:"Riebeek Kasteel"},
  imbuko:{name:"Imbuko Wines",town:"Wellington",lat:-33.612,lon:19.004,q:"Imbuko Wines, Wellington"},
  cpt:{name:"Aeropuerto Ciudad del Cabo",town:"CPT",lat:-33.969,lon:18.602,q:"Cape Town International Airport"}
};
const STAGES = [
  {id:"P",short:"Pról.",date:"2027-03-21",name:"The Decision",km:27,dplus:1050,stars:2,from:"lourensford",to:"lourensford",
   sectors:["Pinot Stairs","Subida N4","Rock Wall","Schoeman's","Big Switch"],tts:"Schoeman's",
   note:"Bucle en sentido horario por el anfiteatro de Lourensford."},
  {id:"1",short:"E1",date:"2027-03-22",name:"The First Question",km:127,dplus:2450,stars:5,from:"ceres",to:"ceres",
   sectors:["Old Theron's Pass","Waboomsberg","Koue Bokkeveld","Kaleo","Old Gydo Pass"],tts:null,
   note:"Waboomsberg es el punto más alto de la historia de la carrera. Bajada técnica por la arenisca de Kaleo."},
  {id:"2",short:"E2",date:"2027-03-23",name:"The Response",km:103,dplus:2050,stars:4.5,from:"ceres",to:"ceres",
   sectors:["Death Drop","Dead Man Walking","Baboon's Highway","Pipeline","Presa de Eselfontein"],tts:"Pipeline",
   note:"Tres bucles en Eselfontein, al este de Ceres."},
  {id:"3",short:"E3",date:"2027-03-24",name:"The Rhythm",km:87,dplus:2250,stars:4,from:"ceres",to:"saronsberg",
   sectors:["Old Gydo Pass","Bokkeveld","Skurfberg","Die Eike","Witzenberg Ridge","Wagon Trail"],tts:"Wagon Trail",
   note:"Traslado de base: de Ceres al nuevo race village de Saronsberg."},
  {id:"4",short:"E4",date:"2027-03-25",name:"The Turning Point",km:96,dplus:2550,stars:4.5,from:"saronsberg",to:"saronsberg",
   sectors:["Oakhurst","God's Window","Kilprivier","Schoonderzicht","Bone Trail"],tts:null,
   note:"Cinco subidas y bajadas por el valle de Tulbagh."},
  {id:"5",short:"E5",date:"2027-03-26",name:"The Crossing",km:114,dplus:2350,stars:3.5,from:"saronsberg",to:"imbuko",via:"riebeek",
   sectors:["Swartland","Riebeek Kasteel","Kasteelberg","Eight Feet","Riebeekberg","Patatskloof"],tts:"Riebeekberg",
   note:"Pista abierta y viento en el Swartland. Día de ir a rueda. Traslado de base a Wellington."},
  {id:"6",short:"E6",date:"2027-03-27",name:"The Cliffhanger",km:83,dplus:3100,stars:5,from:"imbuko",to:"imbuko",
   sectors:["Hawequa","Seven Peaks","Aap d'Huez","Angel's Tears","DNF","Brandslangnek","The Cliffhanger","Full Monty","Route 66","Unhappy Hog","Golden Mile"],tts:null,
   note:"Etapa reina. The Cliffhanger está en Canetsfontein Wine Estate."},
  {id:"7",short:"E7",date:"2027-03-28",name:"The Final Line",km:64,dplus:1350,stars:3,from:"imbuko",to:"imbuko",
   sectors:["Groenberg","Luislang","Welvanpas","Bull Run","True Grit","Doolhof Wine Estate","Blazing Saddles"],tts:null,
   note:"La más suave sobre el papel. Doolhof es buen sitio para animar."}
];
/* Base prevista por noche: después de cada etapa se duerme cerca de la salida del día siguiente */
const NIGHTS = [
  {date:"2027-03-20",base:"Somerset West",label:"Víspera"},
  {date:"2027-03-21",base:"Ceres",label:"Tras el prólogo"},
  {date:"2027-03-22",base:"Ceres",label:"Tras E1"},
  {date:"2027-03-23",base:"Ceres",label:"Tras E2"},
  {date:"2027-03-24",base:"Tulbagh",label:"Tras E3"},
  {date:"2027-03-25",base:"Tulbagh",label:"Tras E4"},
  {date:"2027-03-26",base:"Wellington",label:"Tras E5"},
  {date:"2027-03-27",base:"Wellington",label:"Tras E6"},
  {date:"2027-03-28",base:"Libre",label:"Tras la meta"}
];
const TRANSFERS = [
  {from:"cpt",to:"lourensford",t:"≈ 30 min · 35 km"},
  {from:"lourensford",to:"ceres",t:"≈ 1 h 45 · 130 km"},
  {from:"ceres",to:"saronsberg",t:"≈ 45 min · 50 km"},
  {from:"saronsberg",to:"imbuko",t:"≈ 1 h 10 · 85 km"},
  {from:"imbuko",to:"cpt",t:"≈ 55 min · 70 km"}
];
const TOTAL_KM = STAGES.reduce((a,s)=>a+s.km,0), TOTAL_D = STAGES.reduce((a,s)=>a+s.dplus,0);

/* ---------- Utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapsUrl = p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p);
const dirUrl = p=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(p);
const DAYS=["dom","lun","mar","mié","jue","vie","sáb"];
function saToday(){ // fecha actual en Sudáfrica (UTC+2) como YYYY-MM-DD
  const d=new Date(Date.now()+2*3600e3); return d.toISOString().slice(0,10);
}
function dayLabel(iso){const d=new Date(iso+"T12:00:00Z");return DAYS[d.getUTCDay()]+" "+d.getUTCDate();}
function daysBetween(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}
function starsHtml(n){const f=Math.floor(n),half=n-f>=.5;let h="★".repeat(f)+(half?"½":"")+'<span class="off">'+"★".repeat(5-f-(half?1:0))+"</span>";return `<span class="stars" aria-label="${n} de 5 estrellas">${h}</span>`;}
function addDays(iso,n){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}

/* ---------- Mapa esquemático ---------- */
function mapSvg(highlight){
  const W=360,H=330,pad=26, lon0=18.5,lon1=19.45,lat0=-34.15,lat1=-33.15;
  const k=Math.cos(33.6*Math.PI/180);
  const sx=(W-2*pad)/((lon1-lon0)*k), sy=(H-2*pad)/(lat1-lat0), s=Math.min(sx,sy);
  const P=id=>{const p=PLACES[id];return [pad+(p.lon-lon0)*k*s, pad+(lat1-p.lat)*s];};
  const pt=id=>P(id).map(v=>v.toFixed(1)).join(",");
  const raced=[["ceres","saronsberg","3"],["saronsberg","riebeek","5"],["riebeek","imbuko","5"]];
  const loops={P:"lourensford","1":"ceres","2":"ceres","4":"saronsberg","6":"imbuko","7":"imbuko"};
  let g="";
  // contornos decorativos del relieve (Hex River / Witzenberg / Hawequa) como anillos suaves
  [["ceres",[-36,-18,12,30]],["saronsberg",[18,40]],["imbuko",[22,44]]].forEach(([id,rs])=>{
    const [x,y]=P(id); rs.forEach(r=>{ if(r>0) g+=`<circle cx="${(x+r*.6).toFixed(1)}" cy="${(y-r*.2).toFixed(1)}" r="${Math.abs(r)}" fill="none" stroke="var(--dust)" stroke-width="1"/>`;});
  });
  // traslados en coche
  g+=`<polyline points="${pt("cpt")} ${pt("lourensford")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>`;
  g+=`<polyline points="${pt("lourensford")} ${pt("ceres")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>`;
  // tramos en carrera de punto a punto
  raced.forEach(([a,b,st])=>{
    const on=!highlight||highlight===st;
    g+=`<polyline class="route-line" points="${pt(a)} ${pt(b)}" fill="none" stroke="${on?'var(--ocre)':'var(--dust)'}" stroke-width="${on?6:4}" stroke-linecap="round"/>`;
  });
  // bucles
  Object.entries(loops).forEach(([st,id])=>{
    const [x,y]=P(id); const on=!highlight||highlight===st;
    const off={P:[-4,16],"1":[0,-20],"2":[22,4],"4":[-22,-6],"6":[20,10],"7":[-8,22]}[st];
    g+=`<ellipse cx="${(x+off[0]).toFixed(1)}" cy="${(y+off[1]).toFixed(1)}" rx="15" ry="11" fill="none" stroke="${on?'var(--ocre)':'var(--dust)'}" stroke-width="${on?4:3}"/>`;
    if(on&&highlight) g+=`<text x="${(x+off[0]).toFixed(1)}" y="${(y+off[1]+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${st==="P"?"P":"E"+st}</text>`;
  });
  // puntos y nombres
  const labels={lourensford:[10,4,"start"],ceres:[12,4,"start"],saronsberg:[-10,-8,"end"],riebeek:[-10,4,"end"],imbuko:[10,-10,"start"],cpt:[-8,16,"start"]};
  Object.keys(PLACES).forEach(id=>{
    const [x,y]=P(id),[dx,dy,an]=labels[id];
    const venue=id!=="riebeek"&&id!=="cpt";
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${venue?6:4}" fill="${venue?'var(--ink)':'var(--bg)'}" stroke="var(--ink)" stroke-width="2"/>`;
    g+=`<text x="${(x+dx).toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${an}" font-size="12" font-weight="${venue?700:500}" fill="var(--ink)">${PLACES[id].town==="CPT"?"Aeropuerto CPT":PLACES[id].town}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático de las sedes de la Cape Epic 2027">${g}</svg>`;
}

/* ---------- Estado ---------- */
let casas=[]; let dbReady="loading"; let editing=null; let confirmDel=null; let selStage=null;

/* ---------- Vista HOY ---------- */
function renderHoy(){
  const today=saToday(), first=STAGES[0].date, last=STAGES[STAGES.length-1].date;
  let html="";
  const stage=STAGES.find(s=>s.date===today);
  if(today<first){
    const d=daysBetween(today,first);
    html+=`<div><div class="kicker">Faltan</div><h1 class="today-title num">${d} días<span class="l2">para el prólogo</span></h1></div>`;
    html+=`<div class="stats"><div class="stat"><b class="num">${TOTAL_KM}</b><span>km</span></div><div class="stat"><b class="num">${TOTAL_D.toLocaleString("es-ES")}</b><span>m de desnivel</span></div><div class="stat"><b>8</b><span>días</span></div><div class="stat"><b>3</b><span>sedes</span></div></div>`;
    html+=`<div class="mapbox">${mapSvg(null)}<div class="mapcap"><span class="key"><i></i>En carrera</span><span class="key"><i class="dash"></i>Traslado en coche</span><span>Posiciones reales, trazado esquemático</span></div></div>`;
    html+=stagePanel(STAGES[0],"Primera etapa");
  } else if(stage){
    html+=`<div><div class="kicker">Hoy · ${dayLabel(stage.date)} · ${stage.id==="P"?"Prólogo":"Etapa "+stage.id}</div>${splitTitle(stage.name,"today-title")}</div>`;
    html+=`<div class="stats"><div class="stat"><b class="num">${stage.km}</b><span>km</span></div><div class="stat"><b class="num">${stage.dplus.toLocaleString("es-ES")}</b><span>m D+</span></div><div class="stat">${starsHtml(stage.stars)}<span><br>dureza oficial</span></div></div>`;
    html+=`<div class="btns"><a class="btn" target="_blank" rel="noopener" href="${dirUrl(PLACES[stage.to].q)}">Llévame a meta</a><button class="btn ghost" data-goto-stage="${stage.id}">Ver etapa</button></div>`;
    html+=`<div class="mapbox">${mapSvg(stage.id)}</div>`;
  } else if(today>last){
    html+=`<div><div class="kicker">Hecho</div><h1 class="today-title">Cape Epic<span class="l2">terminada</span></h1></div>`;
  } else {
    html+=`<div><div class="kicker">Hoy</div><h1 class="today-title">Día<span class="l2">de viaje</span></h1></div>`;
  }
  // Dónde se duerme esta noche
  const night=NIGHTS.find(n=>n.date===today) || (today<first?NIGHTS[0]:null);
  if(night){
    const hs=casasForNight(night.date);
    html+=`<div class="panel"><div class="row"><h3>${today<first?"Primera noche":"Esta noche"}</h3><span class="base-tag">${dayLabel(night.date)} · ${night.base}</span></div>`;
    html+= hs.length? hs.map(houseHtml).join("") : `<div class="empty-night">${dbReady==="ok"?"Sin casa apuntada para esta noche.":"Cargando casas…"}</div><div><button class="btn quiet" data-new-casa="${night.date}">Apuntar casa para esta noche</button></div>`;
    html+=`</div>`;
  }
  $("#v-hoy").innerHTML=html;
}
function splitTitle(name,cls){
  const w=name.split(" "); const cut=Math.ceil(w.length/2);
  const a=w.slice(0,cut).join(" "), b=w.slice(cut).join(" ");
  return `<h1 class="${cls}">${esc(a)}${b?`<span class="l2">${esc(b)}</span>`:""}</h1>`;
}
function stagePanel(s,label){
  return `<div class="panel"><div class="row"><h3>${label}</h3><span class="base-tag">${dayLabel(s.date)}</span></div>
  <div class="route">${s.id==="P"?"Prólogo":"Etapa "+s.id} · ${esc(s.name)}</div>
  <div class="small muted">${PLACES[s.from].name} → ${PLACES[s.to].name} · ${s.km} km · ${s.dplus.toLocaleString("es-ES")} m</div>
  <div><button class="btn quiet" data-goto-stage="${s.id}">Abrir ficha</button></div></div>`;
}

/* ---------- Vista ETAPAS ---------- */
function renderEtapas(){
  const today=saToday();
  if(!selStage){const t=STAGES.find(s=>s.date>=today);selStage=(t||STAGES[0]).id;}
  const s=STAGES.find(x=>x.id===selStage);
  let html=`<div class="daystrip" role="tablist" aria-label="Elegir etapa">`+STAGES.map(x=>`<button role="tab" aria-selected="${x.id===selStage}" data-stage="${x.id}"><b>${x.id==="P"?"P":x.id}</b><span>${dayLabel(x.date)}</span></button>`).join("")+`</div>`;
  html+=`<div><div class="kicker">${s.id==="P"?"Prólogo":"Etapa "+s.id} · ${dayLabel(s.date)} marzo</div>${splitTitle(s.name,"stage-h")}</div>`;
  html+=`<div class="stats"><div class="stat"><b class="num">${s.km}</b><span>km</span></div><div class="stat"><b class="num">${s.dplus.toLocaleString("es-ES")}</b><span>m D+</span></div><div class="stat"><b class="num">${Math.round(s.dplus/s.km*10)}</b><span>m D+ cada 10 km</span></div><div class="stat">${starsHtml(s.stars)}<span><br>dureza oficial</span></div></div>`;
  const rk=(f)=>1+STAGES.filter(x=>x[f]>s[f]).length;
  html+=`<div class="panel"><div class="small muted">Puesto entre las 8 etapas (1.ª = la más larga o la de más desnivel)</div>
    <div class="rank-row"><span>Distancia</span><span><b class="rank num">${rk("km")}.ª</b> <span class="muted">de 8 · ${s.km} km</span></span></div>
    <div class="rank-row"><span>Desnivel</span><span><b class="rank num">${rk("dplus")}.ª</b> <span class="muted">de 8 · ${s.dplus.toLocaleString("es-ES")} m</span></span></div></div>`;
  html+=`<div class="panel"><h3>Recorrido</h3><div class="route">${PLACES[s.from].name}${s.via?" → "+PLACES[s.via].name:""} → ${PLACES[s.to].name}</div><p class="small" style="margin:0">${esc(s.note)}</p>
    <ul class="sectors">${s.sectors.map(x=>`<li class="${x===s.tts?'tts':''}">${esc(x)}${x===s.tts?" · Tough Section":""}</li>`).join("")}</ul>
    <div class="btns"><a class="btn" target="_blank" rel="noopener" href="${dirUrl(PLACES[s.from].q)}">Cómo llegar a la salida</a>${s.from!==s.to?`<a class="btn ghost" target="_blank" rel="noopener" href="${dirUrl(PLACES[s.to].q)}">Cómo llegar a meta</a>`:""}</div></div>`;
  html+=`<div class="mapbox">${mapSvg(s.id)}</div>`;
  html+=`<div class="panel"><h3>Avituallamientos</h3><div class="pending">Los water points con su kilómetro y los GPX oficiales salen con el Rider Manual, normalmente en febrero. Aquí aparecerán con hora estimada de paso y botón para llegar en coche.</div></div>`;
  $("#v-etapas").innerHTML=html;
}

/* ---------- Vista CASAS ---------- */
function casasForNight(date){return casas.filter(c=>c.desde<=date&&date<c.hasta);}
function houseHtml(c){
  const del = confirmDel===c.id
    ? `<div class="confirm"><span>¿Borrar ${esc(c.nombre)}?</span><button class="btn" data-del-yes="${c.id}" style="min-height:38px;padding:8px 12px">Borrar</button><button class="btn quiet" data-del-no>Cancelar</button></div>`
    : `<button class="btn quiet" data-del="${c.id}">Borrar</button>`;
  return `<div class="house"><div class="name">${esc(c.nombre)}</div>
    ${c.direccion?`<div class="addr">${esc(c.direccion)}</div>`:""}
    <div class="small muted num">${dayLabel(c.desde)} → ${dayLabel(c.hasta)}${c.checkin?` · check-in ${esc(c.checkin)}`:""}</div>
    ${c.contacto?`<div class="small">Contacto: ${esc(c.contacto)}</div>`:""}
    ${c.notas?`<div class="notes">${esc(c.notas)}</div>`:""}
    <div class="acts">${c.direccion?`<a class="btn quiet" target="_blank" rel="noopener" href="${dirUrl(c.direccion)}">Cómo llegar</a>`:""}<button class="btn quiet" data-edit="${c.id}">Editar</button>${del}</div></div>`;
}
function renderCasas(){
  let html=`<div><div class="kicker">Alojamientos</div><h1 class="stage-h">Dónde<span class="l2" style="display:block;color:var(--ocre);margin-top:-.12em">dormimos</span></h1></div>`;
  if(dbReady==="loading") html+=`<div class="panel small muted">Cargando casas…</div>`;
  else if(dbReady==="off") html+=`<div class="panel"><div class="pending">No se han podido cargar las casas. Revisa la conexión y vuelve a abrir la pestaña.</div></div>`;
  else if(dbReady==="cache") html+=`<div class="panel"><div class="pending">Sin conexión. Ves la última copia guardada en este móvil; para añadir o editar hace falta cobertura.</div></div>`;
  html+=formHtml();
  html+=`<div class="panel">`+NIGHTS.map(n=>{
    const hs=casasForNight(n.date);
    return `<div class="night"><div class="d"><b>${dayLabel(n.date).split(" ")[1]}</b><span>${dayLabel(n.date).split(" ")[0]} · mar</span></div>
      <div class="house"><span class="base-tag">${n.label} · ${n.base}</span>
      ${hs.length?hs.map(houseHtml).join(""):`<span class="empty-night">Sin casa</span>${dbReady==="ok"&&n.base!=="Libre"?`<div><button class="btn quiet" data-new-casa="${n.date}">Apuntar casa</button></div>`:""}`}</div></div>`;
  }).join("")+`</div>`;
  $("#v-casas").innerHTML=html;
}
function formHtml(){
  if(dbReady!=="ok") return "";
  if(!editing) return `<div><button class="btn" data-new-casa="2027-03-20">Añadir casa</button></div>`;
  const c=editing;
  return `<form class="casa panel" id="casa-form"><h3>${c.id?"Editar casa":"Nueva casa"}</h3>
    <label for="f-nombre">Nombre<input id="f-nombre" required value="${esc(c.nombre||"")}" placeholder="Casa Ceres – Airbnb"></label>
    <label for="f-dir">Dirección<input id="f-dir" value="${esc(c.direccion||"")}" placeholder="Calle, pueblo"></label>
    <div class="two"><label for="f-desde">Entrada<input id="f-desde" type="date" required min="2027-03-15" max="2027-04-05" value="${esc(c.desde||"")}"></label>
    <label for="f-hasta">Salida<input id="f-hasta" type="date" required min="2027-03-16" max="2027-04-06" value="${esc(c.hasta||"")}"></label></div>
    <div class="two"><label for="f-checkin">Check-in<input id="f-checkin" value="${esc(c.checkin||"")}" placeholder="16:00"></label>
    <label for="f-contacto">Contacto<input id="f-contacto" value="${esc(c.contacto||"")}" placeholder="Anfitrión, teléfono"></label></div>
    <label for="f-notas">Notas<textarea id="f-notas" rows="3" placeholder="Código de puerta, parking, wifi, quién duerme">${esc(c.notas||"")}</textarea></label>
    <div class="msg" id="f-msg" role="status"></div>
    <div class="btns"><button class="btn" type="submit">${c.id?"Guardar cambios":"Guardar casa"}</button><button class="btn ghost" type="button" data-cancel>Cancelar</button></div></form>`;
}

/* ---------- Vista INFO ---------- */
function renderInfo(){
  const html=`
  <div><div class="kicker">Info útil</div><h1 class="stage-h">A mano<span class="l2" style="display:block;color:var(--ocre);margin-top:-.12em">siempre</span></h1></div>
  <div class="panel"><h3>Traslados en coche</h3><div class="list">${TRANSFERS.map(t=>`<div class="it"><span>${PLACES[t.from].town==="CPT"?"Aeropuerto":PLACES[t.from].town} → ${PLACES[t.to].town==="CPT"?"Aeropuerto":PLACES[t.to].town}</span><b>${t.t}</b></div>`).join("")}</div><div class="small muted">Tiempos aproximados sin tráfico. Se conduce por la izquierda.</div></div>
  <div class="panel"><h3>Sedes</h3><div class="list">${["lourensford","ceres","saronsberg","imbuko"].map(id=>`<div class="it"><span>${PLACES[id].name}<br><span class="small muted">${PLACES[id].town}</span></span><a target="_blank" rel="noopener" href="${mapsUrl(PLACES[id].q)}">Abrir en Maps</a></div>`).join("")}</div></div>
  <div class="panel"><h3>Emergencias en Sudáfrica</h3><div class="list">
    <div class="it"><span>Desde el móvil</span><span><b>112</b> <button class="copy" data-copy="112">Copiar</button></span></div>
    <div class="it"><span>Ambulancia</span><span><b>10177</b> <button class="copy" data-copy="10177">Copiar</button></span></div>
    <div class="it"><span>Policía</span><span><b>10111</b> <button class="copy" data-copy="10111">Copiar</button></span></div></div>
    <div class="small muted">Los teléfonos de la organización y del equipo médico de carrera vienen en el Rider Manual.</div></div>
  <div class="panel"><h3>Hora</h3><p class="small" style="margin:0">Sudáfrica está en UTC+2 todo el año. Durante la carrera va 1 hora por delante de España, hasta el domingo 28, cuando España cambia al horario de verano y pasáis a tener la misma hora.</p></div>
  <div class="panel"><h3>Enlaces oficiales</h3><div class="list">
    <div class="it"><span>Ruta 2027</span><a target="_blank" rel="noopener" href="https://www.epic-series.com/races/capeepic/route">epic-series.com</a></div>
    <div class="it"><span>Rider Manual</span><a target="_blank" rel="noopener" href="https://www.epic-series.com/races/capeepic/manual">epic-series.com</a></div>
    <div class="it"><span>Guía del espectador</span><a target="_blank" rel="noopener" href="https://www.epic-series.com/races/capeepic/supporters">epic-series.com</a></div>
    <div class="it"><span>Horarios del evento</span><a target="_blank" rel="noopener" href="https://www.epic-series.com/races/capeepic/schedule">epic-series.com</a></div></div></div>
  <p class="small muted">Datos de ruta del anuncio oficial de septiembre 2026. Tracks y avituallamientos: pendientes.</p>`;
  $("#v-info").innerHTML=html;
}

/* ---------- Navegación ---------- */
let current="hoy";
function show(v){
  current=v;
  ["hoy","etapas","casas","info"].forEach(k=>{$("#v-"+k).hidden=k!==v;$("#t-"+k).setAttribute("aria-selected",k===v);});
  render(); try{localStorage.setItem("ane-ce-tab",v);}catch(e){}
  window.scrollTo(0,0);
}
function render(){({hoy:renderHoy,etapas:renderEtapas,casas:renderCasas,info:renderInfo})[current]();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-goto-stage]"); if(!t) return;
  if(t.dataset.gotoStage){selStage=t.dataset.gotoStage;show("etapas");return;}
  if(t.dataset.stage){selStage=t.dataset.stage;renderEtapas();return;}
  if(t.dataset.newCasa){const d=t.dataset.newCasa;editing={desde:d,hasta:addDays(d,1)};show("casas");setTimeout(()=>$("#f-nombre")?.focus(),0);return;}
  if(t.dataset.edit){editing={...casas.find(c=>c.id===t.dataset.edit)};show("casas");return;}
  if(t.hasAttribute("data-cancel")){editing=null;renderCasas();return;}
  if(t.dataset.del){confirmDel=t.dataset.del;render();return;}
  if(t.hasAttribute("data-del-no")){confirmDel=null;render();return;}
  if(t.dataset.delYes){const id=t.dataset.delYes;confirmDel=null;try{await api("POST",{accion:"borrar",id});await loadCasas();}catch(err){alert("No se pudo borrar: "+err.message);}return;}
  if(t.dataset.copy){const v=t.dataset.copy;try{await navigator.clipboard.writeText(v);t.textContent="Copiado";}catch(err){t.textContent=v;}setTimeout(()=>t.textContent="Copiar",1500);}
});
function alertMsg(m){const el=$("#f-msg");if(el)el.textContent=m;}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="casa-form") return; e.preventDefault();
  const v=id=>$("#"+id).value.trim();
  const data={nombre:v("f-nombre"),direccion:v("f-dir"),desde:v("f-desde"),hasta:v("f-hasta"),checkin:v("f-checkin"),contacto:v("f-contacto"),notas:$("#f-notas").value.trim()};
  if(!data.nombre||!data.desde||!data.hasta){alertMsg("Faltan nombre, entrada o salida.");return;}
  if(data.hasta<=data.desde){alertMsg("La salida tiene que ser después de la entrada.");return;}
  alertMsg("Guardando…");
  try{
    await api("POST",{accion:"guardar",casa:{...data,id:editing.id||null}});
    editing=null; await loadCasas(); render();
  }catch(err){alertMsg(navigator.onLine?"No se pudo guardar: "+err.message:"Sin conexión. Guarda la casa cuando vuelvas a tener cobertura.");}
});

/* ---------- Reloj ---------- */
function tick(){
  const f=new Intl.DateTimeFormat("es-ES",{timeZone:"Africa/Johannesburg",hour:"2-digit",minute:"2-digit"});
  $("#hdr-clock").textContent=f.format(new Date())+" en Sudáfrica";
}
tick(); setInterval(tick,30000);

/* ---------- Arranque ---------- */
try{const t=localStorage.getItem("ane-ce-tab");if(t&&["hoy","etapas","casas","info"].includes(t))current=t;}catch(e){}
show(current);

/* ---------- Casas: API en el servidor ---------- */
const API="api.php";
async function api(method,body){
  const r=await fetch(API,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("Error "+r.status));
  return j;
}
async function loadCasas(){
  try{
    const j=await api("GET");
    casas=(j.casas||[]).sort((a,b)=>a.desde.localeCompare(b.desde));
    dbReady="ok"; try{localStorage.setItem("ane-ce-casas",JSON.stringify(casas));}catch(e){}
  }catch(e){
    try{const c=JSON.parse(localStorage.getItem("ane-ce-casas")||"null");if(c){casas=c;dbReady="cache";}else dbReady="off";}catch(_){dbReady="off";}
  }
  if(!document.querySelector("#casa-form")) render();
}
loadCasas();
setInterval(()=>{if(!document.hidden)loadCasas();},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadCasas();});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
