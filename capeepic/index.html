<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cape Epic">
<title>ANE Cape Epic 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,112,900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css?v=20261002b">
</head>
<body>
<header class="top">
  <div class="bar-in">
    <div class="mono">ANE <span>×</span> CAPE EPIC</div>
    <div class="top-r"><span class="clock num" id="clock"></span><button class="chip" id="yo" type="button">¿Quién eres?</button></div>
  </div>
  <div class="netbar" id="netbar" role="status" hidden></div>
</header>

<main class="wrap">
  <section class="view" id="v-hoy" aria-label="Hoy"></section>
  <section class="view" id="v-mapa" aria-label="Mapa" hidden></section>
  <section class="view" id="v-etapas" aria-label="Etapas" hidden></section>
  <section class="view" id="v-media" aria-label="Foto y vídeo" hidden></section>
  <section class="view" id="v-mas" aria-label="Más" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button role="tab" id="t-hoy" data-v="hoy">Hoy</button>
    <button role="tab" id="t-mapa" data-v="mapa">Mapa</button>
    <button role="tab" id="t-etapas" data-v="etapas">Etapas</button>
    <button role="tab" id="t-media" data-v="media">Foto/vídeo</button>
    <button role="tab" id="t-mas" data-v="mas">Más</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js?v=20261002b"></script>
</body>
</html>
